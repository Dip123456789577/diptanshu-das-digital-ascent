<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64FFDA" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="14" fill="#0A192F" stroke="#233554" stroke-width="2"/>
  
  <!-- Outer Tech Border Hex/Diamond Accent -->
  <polygon points="32,6 56,18 56,46 32,58 8,46 8,18" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Monogram DD -->
  <text x="32" y="40" font-family="'JetBrains Mono', 'Inter', monospace, sans-serif" font-size="22" font-weight="900" fill="url(#cyanGrad)" text-anchor="middle" letter-spacing="-1px" filter="url(#glow)">DD</text>
  
  <!-- Small tech dot -->
  <circle cx="32" cy="49" r="2" fill="#64FFDA" />
</svg>

